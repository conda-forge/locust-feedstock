# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

# this recipe is kind of heavy: see this script for more automation
# https://gist.github.com/bollwyvl/d6041fcf86348ca719cf925b6d045aca

context:
  version: "2.46.7"
  python_check_max: "3.14"
  summary: Website load testing framework

recipe:
  name: locust-split
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/l/locust/locust-${{ version }}.tar.gz
    sha256: cf112214068abe59615d36769db31ffd1430b67c6e5f693b9a23b8510224442b
    target_directory: dist
  - url: https://github.com/locustio/locust/archive/refs/tags/${{ version }}.tar.gz
    sha256: d391a577ae71313561f8c875d200433598ee36f2512dd51a67253e89b147ac10
    target_directory: src

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: locust
    build:
      noarch: python
      script:
        env:
          SKIP_PRE_BUILD: 'true'
        content:
          - cd dist
          - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      python:
        entry_points:
          - locust = locust.main:main
    requirements:
      host:
        - hatch-vcs
        - hatchling
        - pip
        - python ${{ python_min }}.*
      run:
        - configargparse >=1.7.1
        - flask >=2.0.0
        - flask-cors >=3.0.10
        - flask-login >=0.6.3
        - gevent >=24.10.1
        - geventhttpclient >=2.3.1
        - msgpack-python >=1.0.0
        - psutil >=5.9.1
        - pytest >=8.3.3,<10
        - python >=${{ python_min }}
        - python-engineio >=4.12.2
        - python-socketio >=5.13.0
        - pywin32
        - pyzmq >=25.0.0
        - requests >=2.33.1
        - typing_extensions >=4.6.0
        - werkzeug >=2.0.0
    tests:
      - package_contents:
          strict: true
          site_packages:
            - locust/**
            - locust-${{ version }}.dist-info/**
            - pytest_locust/**
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - locust --version
          - locust --help
    about:
      description: |
        Locust is an easy-to-use, distributed, user load testing tool. It is
        intended for load-testing web sites (or other systems) and figuring out how
        many concurrent users a system can handle.
  - package:
      name: locust-with-milvus
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - pymilvus >=2.5.0
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: ${{ summary }} (with [milvus])
  - package:
      name: locust-with-mqtt
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - paho-mqtt >=2.1.0
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: ${{ summary }} (with [mqtt])
  - package:
      name: locust-with-dns
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - dnspython >=2.8.0
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: ${{ summary }} (with [dns])
  - package:
      name: locust-with-otel
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - opentelemetry-exporter-otlp-proto-grpc >=1.38.0
        - opentelemetry-exporter-otlp-proto-http >=1.38.0
        - opentelemetry-instrumentation-requests >=0.59b0
        - opentelemetry-instrumentation-urllib3 >=0.59b0
        - opentelemetry-sdk >=1.38.0
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: ${{ summary }} (with [otel])
  - package:
      name: locust-with-qdrant
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - qdrant-client >=1.16.2
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: ${{ summary }} (with [qdrant])
  - package:
      name: locust-with-all
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("locust", exact=True) }}
        - ${{ pin_subpackage("locust-with-dns", exact=True) }}
        - ${{ pin_subpackage("locust-with-milvus", exact=True) }}
        - ${{ pin_subpackage("locust-with-mqtt", exact=True) }}
        - ${{ pin_subpackage("locust-with-otel", exact=True) }}
        - ${{ pin_subpackage("locust-with-qdrant", exact=True) }}
    tests:
      - python:
          imports:
            - locust
            - pytest_locust
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - src/locust/test/
        requirements:
          run:
            - cryptography
            - pyquery >=2.0.0,<3.0.0
            - pytest-cov
            - python ${{ python_min }}.*
            - retry >=0.9.2,<1.0.0
        script:
          file: run_test.py
    about:
      summary: ${{ summary }} (with [all])
about:
  license: MIT
  license_file: dist/LICENSE
  summary: ${{ summary }}
  homepage: https://pypi.org/project/locust
  repository: https://github.com/locustio/locust
  documentation: https://docs.locust.io


extra:
  feedstock name: locust
  recipe-maintainers:
    - carlodri
    - bollwyvl
